name: Release
# Three ways to run it, all building the zip from this repo and putting aether-observer.zip and module.json on the release
# for the version in module.json:
#  - push to main that changes module.json: makes the release if that version has none yet (a push that doesn't bump the
#    version leaves the existing release alone);
#  - push a version tag (v0.5.1);
#  - press "Run workflow" on the Actions tab (makes the release, or replaces the files on an existing one).
on:
  push:
    branches: ["main"]
    paths: ["module.json"]
    tags: ["v*"]
  workflow_dispatch:
# Only what a release needs: this job can write releases and nothing else.
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version from module.json
        id: ver
        run: |
          v=$(python3 -c "import json;print(json.load(open('module.json'))['version'])")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != module.json $v"; exit 1; }
          fi
      - name: Zip the module
        run: zip -r aether-observer.zip module.json LICENSE README.md scripts lang samples
      # GitHub's own command line instead of a third-party action: nothing outside GitHub runs with write access to the repo.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "branch" ]; then
              echo "$TAG already has a release; bump the version in module.json to make a new one."
            else
              gh release upload "$TAG" aether-observer.zip module.json --clobber
            fi
          else
            gh release create "$TAG" aether-observer.zip module.json --title "$TAG" --generate-notes --target "${GITHUB_SHA}"
          fi
